# Fly.io Configuration for BosniaAir API
# Generated for deployment on fly.io

app = "bosniaair-api"
primary_region = "ams" # Amsterdam - closest to Bosnia

[build]
  dockerfile = "./backend/src/BosniaAir.Api/Dockerfile.railway"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://0.0.0.0:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "bosniaair_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
